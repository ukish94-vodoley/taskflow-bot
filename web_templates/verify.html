{% extends "base.html" %}
{% block title %}Kodni tasdiqlash — TaskFlow{% endblock %}
{% block content %}
<section class="auth-card">
  <div class="eyebrow">TASDIQLASH</div>
  <h1>6 xonali kodni kiriting</h1>
  <p>Kod Telegram botga yuborildi va 5 daqiqa davomida amal qiladi.</p>
  <form method="post" action="/verify" class="form-stack">
    <label>Tasdiqlash kodi<input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required autofocus></label>
    <button type="submit">Kabinetga kirish</button>
  </form>
  <a class="muted-link" href="/login">Boshqa raqam bilan kirish</a>
</section>
{% endblock %}
